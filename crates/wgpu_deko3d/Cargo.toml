[package]
name = "wgpu_deko3d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A wgpu-hal backend on deko3d, the Nintendo Switch's own GPU API"

[dependencies]
log = "0.4"
naga = { version = "29.0.4", features = ["glsl-out"] }
raw-window-handle = { version = "0.6", default-features = false }
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "wgsl"] }
wgpu-hal = "29.0.4"
wgpu-types = "29.0.4"

[features]
# wgpu-hal 30's API; only with Cargo.wgpu-30.toml's dependencies (scripts/vendor_deko3d.sh).
wgpu-30 = []
