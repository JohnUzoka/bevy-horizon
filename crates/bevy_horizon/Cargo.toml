[package]
name = "bevy_horizon"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Nintendo Switch (Horizon OS) runtime plugin for Bevy Engine"

[dependencies]
bevy_app = { version = "0.19.0", default-features = false }
bevy_ecs = { version = "0.19.0", default-features = false }
bevy_input = { version = "0.19.0", default-features = false }
bevy_window = { version = "0.19.0", default-features = false }
tracing = { version = "0.1", default-features = false }

[target.'cfg(target_os = "horizon")'.dependencies]
# Low-level libnx bindings when targeting Nintendo Switch
