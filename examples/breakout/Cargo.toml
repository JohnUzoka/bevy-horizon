[package]
name = "breakout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy's Breakout showcase on the Switch: the first small game on the ladder"

# The same Bevy and bevy_horizon features as render_check, so the two share every compiled
# dependency and building this one only compiles this crate. Breakout itself needs only the 2D
# parts (bevy_ui_render brings bevy_sprite and bevy_sprite_render).
[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "bevy_log",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
bevy_horizon = { path = "../../crates/bevy_horizon", features = ["vulkan", "fps_overlay", "render"] }
